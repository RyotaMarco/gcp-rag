name: Validate installable stack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Unit and integration tests without provider requests
        run: python -m pytest -q
      - name: Deterministic retrieval plumbing gate
        run: python -m evaluation.run --mode fixture --output evaluation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-evaluation
          path: evaluation-report.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GROQ_API_KEY: ''
      HTTP_BIND: 127.0.0.1
      HTTP_PORT: '8080'
      COMPOSE_PROJECT_NAME: gcp-assistant-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build the real stack
        run: |
          docker compose config --quiet
          docker compose up --build --detach --wait --wait-timeout 240
      - name: Empty index starts successfully and MCP works without a key
        run: python scripts/compose_smoke.py --phase empty
      - name: Index representative fixtures with real multilingual embeddings
        run: docker compose --profile tools run --rm ingest ingest --from-directory /app/evaluation/corpus --rebuild
      - name: Readiness reports index and actual resource count
        run: python scripts/compose_smoke.py --phase indexed
      - name: Real model retrieval gate on the curated fixture corpus
        run: docker compose --profile tools run --rm --entrypoint python ingest -m evaluation.run --mode real --compare-original --output /data/evaluation-real-report.json
      - name: Check idempotent ingest and persistence after a full restart
        run: |
          docker compose --profile tools run --rm ingest ingest --from-directory /app/evaluation/corpus
          docker compose down
          docker compose up --detach --wait --wait-timeout 240
          python scripts/compose_smoke.py --phase restarted
      - name: Export real-model evaluation report
        if: always()
        run: |
          docker compose --profile tools run --rm --entrypoint cat ingest /data/evaluation-real-report.json > evaluation-real-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-evaluation
          path: |
            evaluation-real-report.json
            compose-smoke-state.json
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Remove disposable test volumes
        if: always()
        run: docker compose down --volumes


  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloudflare/requirements-ingest.txt
      - name: Install lightweight collector checks
        run: python -m pip install -r cloudflare/requirements-ingest.txt pytest==8.4.2
      - name: Verify the versioned corpus offline
        run: |
          python cloudflare/scripts/prepare-corpus.py
          python -m pytest -c cloudflare/pytest.ini -q cloudflare/tests/test_prepare_corpus.py
      - name: Build static assets without calling an AI provider
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Install the pinned Cloudflare toolchain
        working-directory: cloudflare
        run: bun install --frozen-lockfile
      - name: Check bindings and TypeScript
        working-directory: cloudflare
        run: bun run typecheck
      - name: Test admission, security, protocol and runtime boundaries
        working-directory: cloudflare
        run: bun test tests
      - name: Validate public, preview and private Worker bundles without deployment
        working-directory: cloudflare
        run: |
          bun run check:deploy
          bun x wrangler deploy --dry-run --config wrangler.preview.jsonc --outdir .wrangler/dry-run-preview
          bun x wrangler deploy --dry-run --config wrangler.mcp.jsonc --outdir .wrangler/dry-run-mcp
